<!DOCTYPE html>
<html>
<head>
    <title>Debug: Clear Invalid Token</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .info { background: #f8f9fa; padding: 15px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Debug: Clear Invalid Token</h1>
    
    <div class="info">
        <h3>Current localStorage contents:</h3>
        <div id="current-data"></div>
    </div>
    
    <button onclick="clearToken()">Clear Invalid Token & Reload</button>
    <button onclick="showData()">Refresh Data</button>
    
    <script>
        function showData() {
            const data = {
                token: localStorage.getItem('token'),
                user: localStorage.getItem('user'),
                device_uuid: localStorage.getItem('device_uuid')
            };
            
            document.getElementById('current-data').innerHTML = `
                <p><strong>Token:</strong> ${data.token ? data.token.substring(0, 20) + '...' : 'None'}</p>
                <p><strong>User:</strong> ${data.user ? 'Present' : 'None'}</p>
                <p><strong>Device UUID:</strong> ${data.device_uuid || 'None'}</p>
            `;
        }
        
        function clearToken() {
            // Clear all auth-related data
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            // Keep device_uuid for next login
            const deviceUuid = localStorage.getItem('device_uuid');
            localStorage.clear();
            if (deviceUuid) {
                localStorage.setItem('device_uuid', deviceUuid);
            }
            
            alert('Token cleared! Redirecting to login...');
            window.location.href = '/login';
        }
        
        // Show current data on load
        showData();
    </script>
</body>
</html>
