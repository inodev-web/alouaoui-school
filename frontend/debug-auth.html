<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Authentication Debug Tool</h1>
    
    <div class="debug-section">
        <h2>Local Storage Check</h2>
        <div id="localStorageInfo"></div>
        <button onclick="checkLocalStorage()">Refresh Local Storage</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>
    
    <div class="debug-section">
        <h2>Test Login</h2>
        <p>Use one of these student accounts:</p>
        <ul>
            <li><strong>Phone:</strong> 0585394158, <strong>Password:</strong> password123</li>
            <li><strong>Phone:</strong> 0654227103, <strong>Password:</strong> password123</li>
            <li><strong>Phone:</strong> 0530175292, <strong>Password:</strong> password123</li>
        </ul>
        <input type="text" id="phone" placeholder="Phone number" value="0585394158">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="testLogin()">Test Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="debug-section">
        <h2>Test API Call</h2>
        <button onclick="testApiCall()">Test /api/subscriptions/active</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="debug-section">
        <h2>Current User State</h2>
        <div id="userState"></div>
    </div>

    <script>
        function checkLocalStorage() {
            const token = localStorage.getItem('token');
            const deviceUuid = localStorage.getItem('device_uuid');
            const user = localStorage.getItem('user');
            
            const info = document.getElementById('localStorageInfo');
            info.innerHTML = `
                <p><strong>Token:</strong> ${token ? token.substring(0, 20) + '...' : '<span class="error">NOT FOUND</span>'}</p>
                <p><strong>Device UUID:</strong> ${deviceUuid || '<span class="error">NOT FOUND</span>'}</p>
                <p><strong>User:</strong> ${user ? '<span class="success">FOUND</span>' : '<span class="error">NOT FOUND</span>'}</p>
                ${user ? `<pre>${JSON.stringify(JSON.parse(user), null, 2)}</pre>` : ''}
            `;
        }
        
        function clearStorage() {
            localStorage.removeItem('token');
            localStorage.removeItem('device_uuid');
            localStorage.removeItem('user');
            checkLocalStorage();
            alert('Storage cleared!');
        }
        
        async function testLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('loginResult');
            
            result.innerHTML = '<p class="warning">Logging in...</p>';
            
            try {
                // Generate device UUID
                const deviceUuid = crypto.randomUUID ? crypto.randomUUID() : 'dev-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('device_uuid', deviceUuid);
                
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        login: phone,
                        password: password,
                        device_uuid: deviceUuid,
                        single_device: false
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.data && data.data.token) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    result.innerHTML = `<p class="success">✅ Login successful!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    checkLocalStorage();
                } else {
                    result.innerHTML = `<p class="error">❌ Login failed: ${data.message || 'Unknown error'}</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Network error: ${error.message}</p>`;
            }
        }
        
        async function testApiCall() {
            const result = document.getElementById('apiResult');
            const token = localStorage.getItem('token');
            const deviceUuid = localStorage.getItem('device_uuid');
            
            if (!token) {
                result.innerHTML = '<p class="error">❌ No token found. Please login first.</p>';
                return;
            }
            
            result.innerHTML = '<p class="warning">Testing API call...</p>';
            
            try {
                const response = await fetch('http://localhost:8000/api/subscriptions/active', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'X-Device-UUID': deviceUuid || '',
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `<p class="success">✅ API call successful!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    result.innerHTML = `<p class="error">❌ API call failed (${response.status}): ${data.message || 'Unknown error'}</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Network error: ${error.message}</p>`;
            }
        }
        
        function checkUserState() {
            const user = localStorage.getItem('user');
            const state = document.getElementById('userState');
            
            if (user) {
                const userData = JSON.parse(user);
                state.innerHTML = `
                    <p class="success">✅ User is logged in</p>
                    <pre>${JSON.stringify(userData, null, 2)}</pre>
                `;
            } else {
                state.innerHTML = '<p class="error">❌ No user data found</p>';
            }
        }
        
        // Initialize
        checkLocalStorage();
        checkUserState();
    </script>
</body>
</html>
