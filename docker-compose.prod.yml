version: '3.8'

services:
  # PHP-FPM pour Laravel
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile.php
      args:
        user: laravel
        uid: 1000
    container_name: alouaoui-school-php-prod
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=alouaoui_school
      - DB_USERNAME=${DB_USERNAME:-alouaoui_school}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - alouaoui-school-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: alouaoui-school-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available/
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./frontend/dist:/var/www/public/frontend
    depends_on:
      - php
    networks:
      - alouaoui-school-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: alouaoui-school-mysql-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alouaoui_school}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-alouaoui_school}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - alouaoui-school-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: alouaoui-school-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - alouaoui-school-network

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.php
      args:
        user: laravel
        uid: 1000
    container_name: alouaoui-school-queue-prod
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=alouaoui_school
      - DB_USERNAME=${DB_USERNAME:-alouaoui_school}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      - mysql
      - redis
      - php
    networks:
      - alouaoui-school-network

  # Scheduler (Laravel Cron)
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.php
      args:
        user: laravel
        uid: 1000
    container_name: alouaoui-school-scheduler-prod
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=alouaoui_school
      - DB_USERNAME=${DB_USERNAME:-alouaoui_school}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - mysql
      - redis
      - php
    networks:
      - alouaoui-school-network

volumes:
  mysql_data:
  redis_data:

networks:
  alouaoui-school-network:
    driver: bridge

