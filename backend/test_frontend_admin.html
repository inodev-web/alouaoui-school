<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Login</title>
</head>
<body>
    <h1>Test Login Admin</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // Generate device UUID
                const deviceUuid = 'test-device-' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('device_uuid', deviceUuid);
                
                // Login
                const loginResponse = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        login: '0555123456',
                        password: '123456789',
                        device_uuid: deviceUuid
                    })
                });
                
                const loginData = await loginResponse.json();
                console.log('Login response:', loginData);
                
                if (loginResponse.ok && loginData.data?.token) {
                    const token = loginData.data.token;
                    localStorage.setItem('token', token);
                    
                    resultDiv.innerHTML = '<p>✅ Login Success!</p>';
                    
                    // Test profile access
                    const profileResponse = await fetch('http://localhost:8000/api/auth/profile', {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });
                    
                    const profileData = await profileResponse.json();
                    console.log('Profile response:', profileData);
                    
                    if (profileResponse.ok) {
                        resultDiv.innerHTML += '<p>✅ Profile Access Success!</p>';
                        resultDiv.innerHTML += `<p>User: ${profileData.data?.firstname} ${profileData.data?.lastname}</p>`;
                        resultDiv.innerHTML += `<p>Role: ${profileData.data?.role}</p>`;
                        
                        // Test courses access
                        const coursesResponse = await fetch('http://localhost:8000/api/courses', {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Accept': 'application/json'
                            }
                        });
                        
                        if (coursesResponse.ok) {
                            resultDiv.innerHTML += '<p>✅ Courses Access Success!</p>';
                        } else {
                            const coursesError = await coursesResponse.text();
                            resultDiv.innerHTML += `<p>❌ Courses Access Failed: ${coursesError}</p>`;
                        }
                        
                    } else {
                        const profileError = await profileResponse.text();
                        resultDiv.innerHTML += `<p>❌ Profile Access Failed: ${profileError}</p>`;
                    }
                    
                } else {
                    resultDiv.innerHTML = `<p>❌ Login Failed: ${JSON.stringify(loginData)}</p>`;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
